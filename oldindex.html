<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posture Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

  :root {
    --good: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --text: #e5e5e5;
    --muted: #555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 20px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Connect button */
  #connectBtn {
    background: none;
    border: 1px solid #333;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 28px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }

  #connectBtn:hover { border-color: #666; color: #fff; }
  #connectBtn:disabled { opacity: 0.3; cursor: default; }

  /* Status dot */
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .dot.connected { background: var(--good); box-shadow: 0 0 6px var(--good); }

  /* Main angle display */
  .angle-card {
    width: 320px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 36px 24px;
    text-align: center;
    transition: border-color 0.4s;
    position: relative;
    overflow: hidden;
    max-width: 90vw;
  }

  .angle-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-color, var(--good));
    transition: background 0.4s;
  }

  .angle-label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .angle-value {
    font-family: 'Syne', sans-serif;
    font-size: 2.8rem;
    font-weight: 800;
    line-height: 1;
    color: var(--accent-color, var(--good));
    transition: color 0.4s;
    letter-spacing: 0px;
    overflow: hidden;
    word-break: break-all;
  }

  .angle-unit {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 2px;
  }

  /* Status cards row */
  .cards-row {
    display: flex;
    gap: 10px;
    width: min(320px, 90vw);
  }

  .info-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 12px;
    text-align: center;
    transition: border-color 0.3s;
  }

  .info-card .card-label {
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .info-card .card-value {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 1px;
    transition: color 0.3s;
  }

  .posture-ok .card-value { color: var(--good); }
  .posture-warn .card-value { color: var(--bad); }

  .motor-off .card-value { color: var(--muted); }
  .motor-on .card-value { color: var(--bad); }
  .motor-on { border-color: var(--bad) !important; animation: pulse 0.8s infinite; }

  @keyframes pulse {
    0%, 100% { border-color: var(--bad); }
    50% { border-color: #7f1d1d; }
  }

  /* Threshold line indicator */
  .threshold-bar {
    width: min(320px, 90vw);
    height: 4px;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
  }

  .threshold-fill {
    height: 100%;
    width: 0%;
    background: var(--good);
    transition: width 0.15s, background 0.4s;
    border-radius: 2px;
  }

  .bar-labels {
    width: min(320px, 90vw);
    display: flex;
    justify-content: space-between;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* Log */
  .log {
    width: min(320px, 90vw);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-align: center;
    height: 16px;
  }
</style>
</head>
<body>

<h1>Posture Monitor</h1>

<div class="status-row">
  <div class="dot" id="dot"></div>
  <span id="statusText">not connected</span>
</div>

<button id="connectBtn">Connect via Bluetooth</button>

<div class="angle-card" id="angleCard" style="--accent-color: var(--good)">
  <div class="angle-label">Forward Flexion</div>
  <div class="angle-value" id="angleValue">--</div>
  <div class="angle-unit">degrees</div>
</div>

<div class="threshold-bar">
  <div class="threshold-fill" id="thresholdFill"></div>
</div>
<div class="bar-labels">
  <span>0°</span>
  <span>threshold: 30°</span>
  <span>90°</span>
</div>

<div class="cards-row">
  <div class="info-card posture-ok" id="postureCard">
    <div class="card-label">Posture</div>
    <div class="card-value" id="postureValue">GOOD</div>
  </div>
  <div class="info-card motor-off" id="motorCard">
    <div class="card-label">Haptic</div>
    <div class="card-value" id="motorValue">OFF</div>
  </div>
</div>

<div class="log" id="log"></div>

<script>
  const THRESHOLD = 30;
  const MOTOR_DELAY = 3000;

  let angle = 0;
  let badPostureStart = null;
  let motorOn = false;

  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const connectBtn = document.getElementById('connectBtn');
  const angleCard = document.getElementById('angleCard');
  const angleValue = document.getElementById('angleValue');
  const thresholdFill = document.getElementById('thresholdFill');
  const postureCard = document.getElementById('postureCard');
  const postureValue = document.getElementById('postureValue');
  const motorCard = document.getElementById('motorCard');
  const motorValue = document.getElementById('motorValue');
  const log = document.getElementById('log');

  function updateDisplay(rawAngle) {
    angle = rawAngle;
    const clamped = Math.max(0, Math.min(90, angle));
    const pct = (clamped / 90) * 100;

    angleValue.textContent = angle.toFixed(1);
    thresholdFill.style.width = pct + '%';

    const now = Date.now();

    if (angle > THRESHOLD) {
      // bad posture
      angleCard.style.setProperty('--accent-color', 'var(--bad)');
      thresholdFill.style.background = 'var(--bad)';
      postureCard.className = 'info-card posture-warn';
      postureValue.textContent = 'POOR';

      if (!badPostureStart) badPostureStart = now;
      if (now - badPostureStart >= MOTOR_DELAY) {
        motorOn = true;
        motorCard.className = 'info-card motor-on';
        motorValue.textContent = 'ON';
      }
    } else {
      // good posture
      angleCard.style.setProperty('--accent-color', 'var(--good)');
      thresholdFill.style.background = angle > 20 ? 'var(--warn)' : 'var(--good)';
      postureCard.className = 'info-card posture-ok';
      postureValue.textContent = 'GOOD';
      badPostureStart = null;
      motorOn = false;
      motorCard.className = 'info-card motor-off';
      motorValue.textContent = 'OFF';
    }
  }

  let buffer = '';

  function handleData(event) {
    const value = event.target.value;
    const decoder = new TextDecoder();
    buffer += decoder.decode(value);

    const lines = buffer.split('\n');
    buffer = lines.pop(); // keep incomplete line

    for (const line of lines) {
      const trimmed = line.trim();
      const num = parseFloat(trimmed);
      if (!isNaN(num) && Math.abs(num) < 200) {
        updateDisplay(num);
      }
    }
  }

  connectBtn.addEventListener('click', async () => {
    try {
      log.textContent = 'scanning...';
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
      });

      log.textContent = 'connecting...';
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
      const characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

      await characteristic.startNotifications();
      characteristic.addEventListener('characteristicvaluechanged', handleData);

      dot.className = 'dot connected';
      statusText.textContent = 'connected · ' + device.name;
      connectBtn.disabled = true;
      log.textContent = 'receiving data...';

      device.addEventListener('gattserverdisconnected', () => {
        dot.className = 'dot';
        statusText.textContent = 'disconnected';
        connectBtn.disabled = false;
        log.textContent = 'connection lost';
      });

    } catch (err) {
      log.textContent = 'error: ' + err.message;
    }
  });
</script>
</body>
</html>
